<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World News</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="World News">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#14171f;--muted:#6b7280;--accent:#d92d20;--chip:#e6e8ee;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#161a22;--text:#f1f3f7;--muted:#9aa3b2;--chip:#222833;--line:#252b36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px}
h1 span{color:var(--accent)}
button.r{border:0;background:var(--chip);color:var(--text);width:40px;height:40px;border-radius:20px;font-size:18px}
button.r.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#status{font-size:12px;color:var(--muted);margin:2px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:7px 14px;border-radius:18px;font-size:14px}
.chip.on{background:var(--accent);color:#fff}
main{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:720px;margin:0 auto}
a.card{display:block;background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px;color:inherit;text-decoration:none;border:1px solid var(--line)}
a.card img{width:100%;height:190px;object-fit:cover;display:block;background:var(--chip)}
.b{padding:12px 14px 14px}
.m{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-bottom:6px}
.m b{color:var(--accent);font-weight:700}
.t{font-size:17px;font-weight:700;line-height:1.28;margin:0 0 6px}
.d{font-size:14px;color:var(--muted);line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sk{height:120px;border-radius:16px;background:var(--card);margin-bottom:12px;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>World <span>News</span></h1><button class="r" id="ref" aria-label="Refresh">↻</button></div>
  <div id="status">Loading…</div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<script>
const FEEDS=[
 {n:"BBC",u:"https://feeds.bbci.co.uk/news/world/rss.xml"},
 {n:"Al Jazeera",u:"https://www.aljazeera.com/xml/rss/all.xml"},
 {n:"Guardian",u:"https://www.theguardian.com/world/rss"},
 {n:"NPR",u:"https://feeds.npr.org/1004/rss.xml"},
 {n:"DW",u:"https://rss.dw.com/rdf/rss-en-all"},
 {n:"France 24",u:"https://www.france24.com/en/rss"},
 {n:"NYT",u:"https://rss.nytimes.com/services/xml/rss/nyt/World.xml"},
 {n:"ABC Australia",u:"https://www.abc.net.au/news/feed/45910/rss.xml"},
 {n:"Times of India",u:"https://timesofindia.indiatimes.com/rssfeeds/296589292.cms"}
];
let items=[],filter="All",loading=false;
const $=id=>document.getElementById(id);
const strip=h=>{const d=document.createElement("div");d.innerHTML=h||"";return (d.textContent||"").replace(/\s+/g," ").trim()};
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function viaJson(f){
  const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.u));
  const j=await r.json(); if(j.status!=="ok")throw 0;
  return j.items.map(i=>({src:f.n,title:strip(i.title),link:i.link,desc:strip(i.description).slice(0,220),
    img:i.thumbnail||(i.enclosure&&i.enclosure.link&&/image|jpg|jpeg|png|webp/i.test(i.enclosure.link+(i.enclosure.type||""))?i.enclosure.link:""),
    t:Date.parse((i.pubDate||"").replace(" ","T")+"Z")||0}));
}
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?"+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)];
async function viaProxy(f,p){
  const r=await fetch(p(f.u));if(!r.ok)throw 0;
  const x=new DOMParser().parseFromString(await r.text(),"text/xml");
  const out=[...x.querySelectorAll("item,entry")].map(e=>{
    const g=s=>{const n=e.querySelector(s);return n?n.textContent:""};
    const l=e.querySelector("link");const link=l?(l.getAttribute("href")||l.textContent):"";
    const m=e.querySelector("thumbnail,content[url],enclosure[url]");
    return {src:f.n,title:strip(g("title")),link:link.trim(),desc:strip(g("description")||g("summary")).slice(0,220),
      img:m?m.getAttribute("url"):"",t:Date.parse(g("pubDate")||g("date")||g("updated"))||0};
  });
  if(!out.length)throw 0;return out;
}
async function get(f){
  try{return await viaJson(f)}catch(e){}
  for(const p of PROXIES){try{return await viaProxy(f,p)}catch(e){}}
  return [];
}
async function viaStatic(){
  const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
  const j=await r.json();return j.items||[];
}
function merge(arr){
  const seen=new Set();
  items=[...arr,...items].filter(i=>i&&i.title&&i.link).sort((a,b)=>b.t-a.t).filter(i=>{const k=i.title.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,300);
  try{localStorage.setItem("wn",JSON.stringify(items))}catch(e){}
}
async function load(){
  if(loading)return;loading=true;
  $("ref").classList.add("spin");$("status").textContent="Updating…";
  if(!items.length)$("list").innerHTML='<div class="sk"></div>'.repeat(5);
  let got=0;
  const sp=viaStatic().then(a=>{got+=a.length;merge(a);render()}).catch(()=>{});
  const lp=Promise.all(FEEDS.map(get)).then(res=>{const a=res.flat();got+=a.length;merge(a);render()});
  await Promise.all([sp,lp]);
  $("status").textContent=got?`Updated ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} · ${items.length} stories`:"Couldn't reach any news source. Showing saved stories.";
  $("ref").classList.remove("spin");loading=false;render();
}
function chips(){
  $("chips").innerHTML=["All",...FEEDS.map(f=>f.n)].map(n=>`<button class="chip ${n===filter?"on":""}" data-n="${esc(n)}">${esc(n)}</button>`).join("");
}
function render(){
  chips();
  const v=items.filter(i=>filter==="All"||i.src===filter);
  $("list").innerHTML=v.length?v.map(i=>`<a class="card" href="${esc(i.link)}" target="_blank" rel="noopener">${i.img?`<img loading="lazy" src="${esc(i.img)}" alt="" onerror="this.remove()">`:""}<div class="b"><div class="m"><b>${esc(i.src)}</b><span>${i.t?ago(i.t):""}</span></div><h2 class="t">${esc(i.title)}</h2>${i.desc?`<p class="d">${esc(i.desc)}</p>`:""}</div></a>`).join(""):'<div class="empty">No stories yet.</div>';
}
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){filter=b.dataset.n;render();scrollTo(0,0)}});
$("ref").onclick=load;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
window.addEventListener("pageshow",e=>{if(e.persisted)load()});
try{items=JSON.parse(localStorage.getItem("wn")||"[]");if(items.length)render()}catch(e){}
load();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
